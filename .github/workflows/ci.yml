name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax
        run: bash -n install.sh doctor.sh drill.sh mcp/wrapper.example.sh
      - name: shellcheck
        run: shellcheck -S warning install.sh doctor.sh drill.sh mcp/wrapper.example.sh
      - name: no secrets sneak in
        run: |
          ! grep -rInE "(api[_-]?key|token|password)\s*=\s*['\"][A-Za-z0-9]{16,}" \
            --include='*.sh' --include='*.md' .
